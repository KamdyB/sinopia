name: Phase 0 verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [phase-0-end-to-end]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install fastapi uvicorn pydantic openai 'SQLAlchemy>=2.0' 'psycopg[binary]>=3.1' google-auth requests cryptography pytest httpx
      - run: pytest -q
        env:
          DATABASE_URL: sqlite:///./ci.db
  coach-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  landing-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run build
