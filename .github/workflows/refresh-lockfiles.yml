name: Refresh npm lockfiles

on:
  workflow_dispatch:
  push:
    branches: ["security/**"]
    paths:
      - "frontend/package.json"
      - "landing/package.json"

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Resolve frontend lockfile
        run: npm install --package-lock-only --ignore-scripts
        working-directory: frontend
      - name: Resolve landing lockfile
        run: npm install --package-lock-only --ignore-scripts
        working-directory: landing
      - name: Commit generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json landing/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already match package manifests."
            exit 0
          fi
          git commit -m "security: refresh npm lockfiles"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
